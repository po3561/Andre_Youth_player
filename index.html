<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Youth_player</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>

<body>
    <div id="bg-image"></div>
    <div class="glass-background"></div>

    <div class="app-container">
        <header class="top-nav" id="main-header">
            <div class="nav-normal-layer">
                <div class="nav-side">
                    <button id="btn-open-chat" class="icon-btn" aria-label="채팅창 열기">
                        <i class="fa-solid fa-comment-dots"></i>
                        <span id="chat-badge" class="badge"></span>
                    </button>
                    <button id="btn-vol-trigger" class="icon-btn ml-8" aria-label="볼륨 조절">
                        <i class="fa-solid fa-volume-high"></i>
                    </button>
                </div>
                <div class="nav-title">
                    <span class="sub-title">4월30일 기도회</span>
                    <span class="main-title">믿음으로 기. 대하다</span>
                </div>
                <div class="nav-side" style="justify-content: flex-end;">
                    <button id="btn-upload" class="icon-btn mr-8" aria-label="곡 추가"><i
                            class="fa-solid fa-plus"></i></button>
                    <button id="btn-share" class="icon-btn mr-8" aria-label="공유하기"><i
                            class="fa-solid fa-arrow-up-from-bracket"></i></button>
                    <button id="btn-copyright" class="icon-btn" aria-label="저작권 정보"><i
                            class="fa-solid fa-circle-info"></i></button>
                </div>
            </div>

            <div class="nav-volume-layer">
                <i class="fa-solid fa-volume-low"></i>
                <input type="range" id="sb-volume-slider" value="80" step="1" min="0" max="100">
                <i class="fa-solid fa-volume-high"></i>
                <button id="btn-vol-close" class="vol-close-btn"><i class="fa-solid fa-xmark"></i></button>
            </div>
        </header>

        <main class="player-body">
            <div class="album-section" id="album-trigger">
                <img src="" id="album-img" class="album-art" alt="Album Art">
                <div class="lyrics-hint">TAP FOR LYRICS</div>
            </div>

            <div class="info-section">
                <div class="text-group">
                    <h2 id="disp-title">Loading...</h2>
                    <p id="disp-artist">우리가 늘 모이던 곳 6층</p>
                </div>
                <button id="btn-scrap" class="heart-btn" aria-label="좋아요"><i class="fa-regular fa-heart"></i></button>
            </div>

            <div class="playback-section">
                <input type="range" id="progress-bar" value="0" step="0.1" min="0" max="100">
                <div class="time-row">
                    <span id="time-now">0:00</span>
                    <span id="time-total">0:00</span>
                </div>
            </div>

            <div class="control-section">
                <button id="btn-shuffle" class="opt-btn" aria-label="셔플"><i class="fa-solid fa-shuffle"></i></button>
                <button id="btn-prev" class="main-btn side" aria-label="이전 곡"><i
                        class="fa-solid fa-backward-step"></i></button>
                <div class="play-btn-glow">
                    <button id="btn-play-pause" class="main-btn play" aria-label="재생/일시정지"><i
                            class="fa-solid fa-play"></i></button>
                </div>
                <button id="btn-next" class="main-btn side" aria-label="다음 곡"><i
                        class="fa-solid fa-forward-step"></i></button>
                <button id="btn-repeat" class="opt-btn" aria-label="반복">
                    <i class="fa-solid fa-repeat"></i>
                    <span class="repeat-dot"></span>
                </button>
            </div>
        </main>

        <div id="lyrics-overlay">
            <div class="lyrics-header">
                <span id="lyrics-title-text">곡 제목</span>
                <button id="btn-close-lyrics" class="icon-btn"><i class="fa-solid fa-chevron-down"></i></button>
            </div>
            <div class="lyrics-container">
                <div id="lyrics-scroll-area"></div>
            </div>
        </div>

        <div id="upload-overlay" class="ios-popup">
            <div class="popup-card glass-card">
                <div class="popup-header">
                    <span>구글 드라이브에 곡 추가</span>
                    <button class="close-x"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <div class="popup-body upload-body">
                    <div class="upload-field">
                        <label for="upload-audio">음원 파일 (.mp3)</label>
                        <input type="file" id="upload-audio" accept="audio/*">
                    </div>
                    <div class="upload-field">
                        <label for="upload-image">커버 이미지 (.jpg)</label>
                        <input type="file" id="upload-image" accept="image/*">
                    </div>
                    <div class="upload-field">
                        <label for="upload-lyrics">가사 파일 (.lrc) - 선택사항</label>
                        <input type="file" id="upload-lyrics" accept=".lrc">
                    </div>
                    <button id="btn-do-upload" class="primary-btn">업로드 시작</button>
                    <div id="upload-status"></div>
                </div>
            </div>
        </div>

        <div id="chat-overlay" class="ios-popup">
            <div class="popup-card glass-card">
                <div class="popup-header">
                    <span>기도 제목 나누기 (익명)</span>
                    <button class="close-x"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <div id="chat-messages" class="chat-viewport"></div>
                <div class="chat-input-row">
                    <input type="text" id="chat-input" placeholder="기도 상달하기..." autocomplete="off">
                    <button id="btn-send-chat" class="send-btn"><i class="fa-solid fa-arrow-up"></i></button>
                </div>
            </div>
        </div>

        <div id="copyright-overlay" class="ios-popup">
            <div class="popup-card glass-card">
                <div class="popup-header">
                    <span>저작권 정보</span>
                    <button class="close-x"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <div class="popup-body">
                    <div class="copyright-notice">본 플레이어는 비영리 목적으로 운영됩니다.</div>
                    <div class="copy-list" id="dynamic-copy-list">
                        <!-- 동적으로 생성됩니다 -->
                    </div>
                </div>
            </div>
        </div>

        <section class="bottom-sheet glass-sheet" id="sheet">
            <div class="sheet-top" id="sheet-trigger">
                <div class="drag-pill"></div>
                <div class="sheet-title">PLAYLIST</div>
            </div>
            <div class="sheet-main">
                <div class="list-head">
                    <h3>찬양 목록</h3>
                    <span class="count-txt">총 <span id="total-count">0</span>곡</span>
                </div>
                <div class="list-scroll-area">
                    <ul id="song-list-ul"></ul>
                </div>
            </div>
        </section>
    </div>

    <!-- 오디오 엔진 (기능 핵심) -->
    <audio id="audio-engine"></audio>

    <script src="music-engine.js"></script>

    <script src="script.js"></script>
</body>

</html>
