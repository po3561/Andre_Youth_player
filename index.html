<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎵</text></svg>">
    <title>ANDREW YOUTH Player</title>
    <meta name="description" content="Andre Youth 찬양 음악 플레이어 - 믿음으로 기대하다">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="index.css?v=3.1">
</head>
<body>
    <!-- Splash Screen -->
    <div id="splash-screen">
        <div class="splash-content">
            <div class="splash-logo">A</div>
            <h2>ANDREW YOUTH</h2>
            <div class="splash-loader"></div>
        </div>
    </div>

    <div id="song-loading-overlay">
        <div class="loader-bars"><span></span><span></span><span></span></div>
    </div>

    <div id="app-background"></div>
    
    <div id="app-container">
        <!-- Header: 채팅+문의 왼쪽, 볼륨+관리자 오른쪽 -->
        <!-- Header: 채팅+문의 및 모드 스위치 왼쪽, 절대 정중앙 타이틀, 볼륨+관리자 오른쪽 -->
        <header class="header">
            <div class="header-left">
                <div class="header-left-top">
                    <button class="icon-btn" id="btn-open-chat" title="채팅"><i class="fa-solid fa-comment"></i></button>
                    <button class="icon-btn" id="btn-inquiry" title="문의"><i class="fa-solid fa-envelope"></i></button>
                </div>
                <div class="header-left-bottom">
                    <div class="shorts-toggle" id="shorts-toggle-btn" title="쇼츠 모드 전환" role="button" tabindex="0">
                        <input type="checkbox" id="shorts-mode-toggle">
                        <span class="shorts-toggle-slider"></span>
                        <i class="fa-solid fa-clapperboard shorts-toggle-icon"></i>
                        <span class="shorts-new-badge">NEW!</span>
                    </div>
                </div>
            </div>
            <div class="header-title center-absolute-title">
                <h2 id="top-subtitle">ANDREW YOUTH</h2>
                <h1 id="top-title">믿음으로 기대하다</h1>
            </div>
            <div class="header-right">
                <button class="icon-btn" id="btn-vol-pop" title="볼륨"><i class="fa-solid fa-volume-high"></i></button>
                <button class="icon-btn" id="btn-admin-login" title="관리자"><i class="fa-solid fa-lock"></i></button>
            </div>
        </header>

        <!-- Volume Accordion (아이콘 바로 아래 아코디언) -->
        <div class="volume-accordion">
            <i class="fa-solid fa-volume-low"></i>
            <input type="range" id="volume-slider" min="0" max="100" value="80">
            <i class="fa-solid fa-volume-high"></i>
        </div>

        <!-- Dynamic Island D-Day Promo Banner -->
        <div id="promo-banner-card" class="dynamic-island-banner hidden">
            <div class="island-dday-pill" id="promo-dday-badge">D-DAY</div>
            <div class="island-content">
                <span id="promo-main-title" class="island-title"></span>
                <span class="island-sep">·</span>
                <span id="promo-sub-text" class="island-sub"></span>
            </div>
        </div>

        <!-- Main Player -->
        <main class="player-content">
            <div class="album-section" id="album-trigger">
                <div class="album-art-wrap">
                    <img src="" alt="Album Artwork" id="artwork">
                </div>
                <div class="lyrics-overlay" id="lyrics-overlay">
                    <button class="close-lyrics-btn" id="btn-close-lyrics" title="가사 닫기"><i class="fa-solid fa-xmark"></i></button>
                    <div id="lyrics-scroll"></div>
                </div>
            </div>

            <div class="song-info">
                <h2 id="disp-title">AndreW Youth</h2>
                <p id="disp-artist">Select a song to play</p>
                <button class="scrap-btn" id="btn-scrap" title="좋아요">
                    <i class="fa-regular fa-heart"></i>
                </button>
            </div>

            <div class="controls-section">
                <div class="progress-container">
                    <div class="progress-bar-wrap" id="progress-bar-area">
                        <div id="progress-fill"></div>
                        <div id="progress-knob"></div>
                    </div>
                    <div class="time-stamps">
                        <span id="time-now">0:00</span>
                        <span id="time-total">0:00</span>
                    </div>
                </div>

                <div class="main-controls">
                    <button class="control-btn" id="btn-shuffle" title="셔플" aria-label="셔플 모드 전환"><i class="fa-solid fa-shuffle"></i></button>
                    <button class="control-btn" id="btn-prev" title="이전" aria-label="이전 곡 재생"><i class="fa-solid fa-backward-step"></i></button>
                    <button class="control-btn play-pause" id="btn-play-pause" title="재생" aria-label="재생/일시정지"><i class="fa-solid fa-play"></i></button>
                    <button class="control-btn" id="btn-next" title="다음" aria-label="다음 곡 재생"><i class="fa-solid fa-forward-step"></i></button>
                    <button class="control-btn" id="btn-repeat" title="반복" aria-label="반복 모드 전환"><i class="fa-solid fa-repeat"></i></button>
                </div>
            </div>
        </main>

        <!-- Footer: 막대기(handle bar)로만 표시, 터치하면 플레이리스트 열림 -->
        <footer class="footer-bar">
            <div class="footer-handle" id="btn-open-list" title="재생 목록 열기"></div>
        </footer>
    </div>
    <!-- Startup Advertisement / Notice Popup -->
    <div id="startup-popup-overlay" class="modal-overlay" style="display: none; z-index: 10000; justify-content: center; align-items: center; background: rgba(0,0,0,0.8);">
        <div class="startup-popup-card" style="width: 90%; max-width: 400px; background: #fff; border-radius: 16px; overflow: hidden; display: flex; flex-direction: column;">
            <img id="startup-popup-img" src="" alt="공지 팝업" style="width: 100%; max-height: 70vh; object-fit: contain; background: #000; display: block;">
            <div style="display: flex; border-top: 1px solid #eee;">
                <button id="btn-popup-hide-today" style="flex: 1; padding: 16px; background: transparent; border: none; font-size: 0.95rem; font-weight: 600; color: #666; cursor: pointer; border-right: 1px solid #eee;">오늘 하루 보지 않음</button>
                <button id="btn-popup-close" style="flex: 1; padding: 16px; background: transparent; border: none; font-size: 0.95rem; font-weight: 700; color: #000; cursor: pointer;">닫기</button>
            </div>
        </div>
    </div>

    <!-- Playlist Sheet -->
    <div id="playlist-sheet">
        <div class="sheet-handle" id="sheet-handle"></div>
        <h3 class="sheet-title">다음 재생 목록</h3>
        <div class="song-list" id="song-list-container"></div>
    </div>

    <!-- Modal Popups -->
    <div id="modal-container" class="modal-overlay">
        <div id="chat-popup" class="floating-popup">
            <div class="popup-header">
                <h3>실시간 익명 채팅</h3>
                <button class="close-btn" onclick="closeAllModals()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div id="chat-messages" class="chat-content"></div>
            <div class="chat-input-area">
                <input type="text" id="chat-input" placeholder="메세지를 입력하세요...">
                <button id="btn-send-chat"><i class="fa-solid fa-paper-plane"></i></button>
            </div>
        </div>

        <div id="inquiry-popup" class="floating-popup">
            <div class="popup-header">
                <h3>플레이리스트 문의</h3>
                <button class="close-btn" onclick="closeAllModals()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="popup-form">
                <input type="text" id="inq-title" placeholder="제목">
                <textarea id="inq-content" placeholder="문의 내용 (곡 요청 등)"></textarea>
                <input type="text" id="inq-contact" placeholder="연락처 (이메일/번호)">
                <button class="submit-btn" id="btn-submit-inquiry">문의 전송하기</button>
            </div>
        </div>

        <div id="admin-popup" class="floating-popup">
            <div class="popup-header">
                <h3 id="admin-popup-title">관리자 인증</h3>
                <button class="close-btn" onclick="closeAllModals()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="popup-form" id="admin-auth-form">
                <input type="text" id="admin-id" placeholder="아이디">
                <input type="password" id="admin-password" placeholder="비밀번호">
                <button class="submit-btn" id="btn-do-login">로그인</button>
                <div class="auth-toggle">계정이 없으신가요? <span onclick="toggleAuthMode(true)">회원가입</span></div>
            </div>
            <div class="popup-form" id="admin-signup-form" style="display:none; max-height: 50vh; overflow-y: auto;">
                <input type="text" id="signup-id" placeholder="사용할 아이디">
                <input type="password" id="signup-password" placeholder="비밀번호">
                <input type="text" id="signup-name" placeholder="이름 (예: 홍길동)">
                <input type="text" id="signup-phone" placeholder="전화번호 (예: 01012345678)">
                <input type="text" id="signup-company" placeholder="사명 (예: 기획과)">
                <input type="text" id="signup-position" placeholder="직책 (예: 부과장)">
                <button class="submit-btn" id="btn-do-signup">회원가입 완료</button>
                <div class="auth-toggle">이미 계정이 있나요? <span onclick="toggleAuthMode(false)">로그인</span></div>
            </div>
        </div>
    </div>

    <!-- Shorts Mode Fullscreen Container -->
    <div id="shorts-container" class="shorts-hidden">
        <!-- Shorts Top Compact One-Line Header -->
        <div class="shorts-top-compact-bar">
            <button class="shorts-mode-pill-btn" id="btn-exit-shorts-mode" title="플레이리스트 모드로 전환">
                <i class="fa-solid fa-music"></i> 플레이리스트
            </button>
            <div id="shorts-promo-banner" class="shorts-promo-pill hidden">
                <span class="shorts-promo-badge" id="shorts-promo-dday-badge">D-DAY</span>
                <span class="shorts-promo-title" id="shorts-promo-main-title"></span>
                <span class="shorts-promo-sep">·</span>
                <span class="shorts-promo-sub" id="shorts-promo-sub-text"></span>
            </div>
        </div>
        <div class="shorts-viewport">
            <div class="shorts-slide shorts-active">
                <video class="shorts-video" playsinline webkit-playsinline loop></video>
                <div class="shorts-overlay">
                    <div class="shorts-actions">
                        <button class="shorts-action-btn" id="shorts-like-btn">
                            <i class="fa-regular fa-heart"></i>
                            <span class="shorts-action-count" id="shorts-like-count">0</span>
                        </button>
                        <button class="shorts-action-btn" id="shorts-comment-btn">
                            <i class="fa-regular fa-comment"></i>
                            <span class="shorts-action-count" id="shorts-comment-count">0</span>
                        </button>
                        <button class="shorts-action-btn" id="shorts-share-btn">
                            <i class="fa-solid fa-share"></i>
                            <span class="shorts-action-count">공유</span>
                        </button>
                        <button class="shorts-action-btn" id="shorts-mute-btn" title="소리 켜기/끄기">
                            <i class="fa-solid fa-volume-high" id="shorts-mute-icon"></i>
                            <span class="shorts-action-count" id="shorts-mute-label">소리켬</span>
                        </button>
                    </div>
                    <div class="shorts-info">
                        <h3 class="shorts-title"></h3>
                        <p class="shorts-desc"></p>
                    </div>

                    <!-- Shorts Auto Next Countdown Overlay -->
                    <div id="shorts-auto-next-card" class="shorts-auto-next-card" style="display: none;">
                        <div class="shorts-auto-next-info">
                            <span class="shorts-auto-next-icon"><i class="fa-solid fa-circle-play"></i></span>
                            <span id="shorts-auto-next-text"><strong id="shorts-auto-next-sec">3</strong>초 후 다음 영상 자동 재생</span>
                        </div>
                        <button id="btn-cancel-auto-next" class="shorts-cancel-btn" type="button">취소</button>
                    </div>
                    <!-- Shorts Bottom Scrubber Bar -->
                    <div class="shorts-progress-bar-wrap" id="shorts-progress-zone">
                        <input type="range" id="shorts-seek-slider" class="shorts-seek-slider" min="0" max="100" value="0" step="0.1">
                        <div class="shorts-time-badge">
                            <span id="shorts-cur-time">0:00</span> / <span id="shorts-dur-time">0:00</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="shorts-empty-state" style="display:none;">
            <i class="fa-solid fa-film"></i>
            <p>업로드된 쇼츠가 없습니다</p>
        </div>

        <!-- Shorts Comments Bottom Sheet (inside #shorts-container) -->
        <div id="shorts-comments-sheet" class="bottom-sheet">
            <div class="bottom-sheet-backdrop"></div>
            <div class="bottom-sheet-content">
                <div class="bottom-sheet-handle"></div>
                <div class="bottom-sheet-header">
                    <h3>댓글</h3>
                    <button class="bottom-sheet-close"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <div class="bottom-sheet-body" id="shorts-comments-list"></div>
                <div class="bottom-sheet-input">
                    <input type="text" id="shorts-comment-nickname" placeholder="닉네임" maxlength="20">
                    <input type="text" id="shorts-comment-input" placeholder="댓글을 입력하세요..." maxlength="200">
                    <button id="shorts-comment-send"><i class="fa-solid fa-paper-plane"></i></button>
                </div>
            </div>
        </div>
    </div>

    <audio id="audio-engine" preload="metadata" playsinline></audio>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="cloudflare-api.js?v=3.1"></script>
    <script src="music-engine.js?v=3.1"></script>
    <script src="script.js?v=3.1"></script>
</body>
</html>
