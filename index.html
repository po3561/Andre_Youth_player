<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎵</text></svg>">
    <title>Andre Youth Player</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="preload" as="style">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div id="splash-screen">
        <div class="splash-content">
            <div class="splash-logo">A</div>
            <h2>Andre Youth</h2>
            <div class="splash-loader"></div>
        </div>
    </div>

    <div id="song-loading-overlay">
        <div class="loader-bars">
            <span></span><span></span><span></span>
        </div>
    </div>

    <div id="app-background"></div>
    
    <div id="app-container">
        <!-- Header -->
        <header class="header">
            <div class="header-left">
                <button class="icon-btn" id="btn-open-chat" title="채팅 열기">
                    <i class="fa-solid fa-comment"></i>
                </button>
            </div>
            <div class="header-title">
                <h2 id="top-subtitle">음악으로 길을 잇다</h2>
                <h1 id="top-title">Andre Youth Player</h1>
            </div>
            <div class="header-right">
                <button class="icon-btn" id="btn-inquiry" title="문의하기">
                    <i class="fa-solid fa-envelope"></i>
                </button>
                <button class="icon-btn" id="btn-admin-login" title="관리자 로그인">
                    <i class="fa-solid fa-lock"></i>
                </button>
            </div>
        </header>

        <!-- Main Player -->
        <main class="player-content">
            <div class="album-section" id="album-trigger">
                <div class="album-art-wrap">
                    <img src="" alt="Album Artwork" id="artwork">
                </div>
                <div class="lyrics-overlay" id="lyrics-overlay">
                    <div id="lyrics-scroll">
                        <!-- Lyrics lines will be injected here -->
                    </div>
                </div>
            </div>

            <div class="song-info">
                <h2 id="disp-title">Andre Youth</h2>
                <p id="disp-artist">Select a song to play</p>
                <button class="scrap-btn" id="btn-scrap" title="좋아요">
                    <i class="fa-regular fa-heart"></i>
                </button>
            </div>

            <div class="controls-section">
                <div class="progress-container">
                    <div class="progress-bar-wrap" id="progress-bar-area" title="재생 위치 조절">
                        <div id="progress-fill"></div>
                        <div id="progress-knob"></div>
                    </div>
                    <div class="time-stamps">
                        <span id="time-now">0:00</span>
                        <span id="time-total">0:00</span>
                    </div>
                </div>

                <div class="main-controls">
                    <button class="control-btn" id="btn-shuffle" title="셔플 모드 켜기/끄기">
                        <i class="fa-solid fa-shuffle"></i>
                    </button>
                    <button class="control-btn" id="btn-prev" title="이전 곡">
                        <i class="fa-solid fa-backward-step"></i>
                    </button>
                    <button class="control-btn play-pause" id="btn-play-pause" title="재생/일시정지">
                        <i class="fa-solid fa-play"></i>
                    </button>
                    <button class="control-btn" id="btn-next" title="다음 곡">
                        <i class="fa-solid fa-forward-step"></i>
                    </button>
                    <button class="control-btn" id="btn-repeat" title="반복 모드 변경">
                        <i class="fa-solid fa-repeat"></i>
                    </button>
                </div>

                <!-- Volume Popover Area (Optional or persistent) -->
                <div class="full-width-vol-container">
                    <i class="fa-solid fa-volume-low"></i>
                    <input type="range" id="volume-slider" min="0" max="100" value="80">
                    <i class="fa-solid fa-volume-high"></i>
                </div>
            </div>
        </main>

        <footer class="footer-bar">
            <button class="icon-btn btn-open-list-wrap" id="btn-open-list" title="재생 목록 열기">
                <i class="fa-solid fa-list-ul"></i>
                <span>목록</span>
            </button>
            <button class="icon-btn" id="btn-vol-pop" title="볼륨 조절">
                <i class="fa-solid fa-volume-high"></i>
            </button>
        </footer>
    </div>

    <div id="playlist-sheet">
        <div class="sheet-handle" id="sheet-handle" title="목록 닫기"></div>
        <h3 class="sheet-title">다음 재생 목록</h3>
        <div class="song-list" id="song-list-container"></div>
    </div>

    <!-- Floating Popups Container -->
    <div id="modal-container" class="modal-overlay">
        <!-- Anonymous Chat Popup -->
        <div id="chat-popup" class="floating-popup">
            <div class="popup-header">
                <h3>실시간 익명 채팅</h3>
                <button class="close-btn" onclick="closeAllModals()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div id="chat-messages" class="chat-content"></div>
            <div class="chat-input-area">
                <input type="text" id="chat-input" placeholder="메세지를 입력하세요...">
                <button id="btn-send-chat"><i class="fa-solid fa-paper-plane"></i></button>
            </div>
        </div>

        <!-- Inquiry Popup -->
        <div id="inquiry-popup" class="floating-popup">
            <div class="popup-header">
                <h3>플레이리스트 문의</h3>
                <button class="close-btn" onclick="closeAllModals()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="popup-form">
                <input type="text" id="inq-title" placeholder="제목">
                <textarea id="inq-content" placeholder="문의 내용 (곡 요청 등)"></textarea>
                <input type="text" id="inq-contact" placeholder="연락처 (이메일/번호)">
                <button class="submit-btn" id="btn-submit-inquiry">문의 전송하기</button>
            </div>
        </div>

        <!-- Admin Auth Popup (Login & Sign Up) -->
        <div id="admin-popup" class="floating-popup">
            <div class="popup-header">
                <h3 id="admin-popup-title">관리자 인증</h3>
                <button class="close-btn" onclick="closeAllModals()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="popup-form" id="admin-auth-form">
                <input type="email" id="admin-email" placeholder="이메일">
                <input type="password" id="admin-password" placeholder="비밀번호">
                <button class="submit-btn" id="btn-do-login">로그인</button>
                <div class="auth-toggle">
                    계정이 없으신가요? <span onclick="toggleAuthMode(true)">회원가입</span>
                </div>
            </div>
            <!-- Signup Form (Hidden by default) -->
            <div class="popup-form" id="admin-signup-form" style="display:none;">
                <input type="email" id="signup-email" placeholder="사용할 이메일">
                <input type="password" id="signup-password" placeholder="비밀번호">
                <button class="submit-btn" id="btn-do-signup">회원가입 완료</button>
                <div class="auth-toggle">
                    이미 계정이 있나요? <span onclick="toggleAuthMode(false)">로그인</span>
                </div>
            </div>
        </div>
    </div>

    <audio id="audio-engine" preload="auto"></audio>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>
    <script src="music-engine.js"></script>
    <script src="script.js"></script>
</body>
</html>
