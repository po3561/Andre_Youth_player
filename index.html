<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Youth_player</title>
    <link rel="icon" href="/Andre_Youth_player/favicon.ico" sizes="any">
    <link rel="shortcut icon" href="/Andre_Youth_player/favicon.ico">
    <link rel="stylesheet" href="style.css?v=20260502-1">
    <link rel="preconnect" href="https://code.jquery.com">
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
        onload="this.onload=null;this.rel='stylesheet'">
    <noscript>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    </noscript>
    <script defer src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>

<body>
    <div id="bg-image"></div>
    <div class="glass-background"></div>

    <div class="app-container">
        <header class="top-nav" id="main-header">
            <div class="nav-normal-layer">
                <div class="nav-side">
                    <button id="btn-open-chat" class="icon-btn" aria-label="채팅 열기">
                        <i class="fa-solid fa-comment-dots"></i>
                        <span id="chat-badge" class="badge"></span>
                    </button>
                    <button id="btn-vol-trigger" class="icon-btn ml-8" aria-label="볼륨 조절">
                        <i class="fa-solid fa-volume-high"></i>
                    </button>
                </div>
                <div class="nav-title">
                    <span class="sub-title">Andre Youth Playlist</span>
                    <span class="main-title">음악으로 길을 잇다</span>
                </div>
                <div class="nav-side" style="justify-content: flex-end;">
                    <button id="btn-share" class="icon-btn mr-8" aria-label="공유하기">
                        <i class="fa-solid fa-arrow-up-from-bracket"></i>
                    </button>
                    <button id="btn-copyright" class="icon-btn" aria-label="저작권 정보">
                        <i class="fa-solid fa-circle-info"></i>
                    </button>
                </div>
            </div>

            <div class="nav-volume-layer">
                <i class="fa-solid fa-volume-low"></i>
                <input type="range" id="sb-volume-slider" value="80" step="1" min="0" max="100">
                <i class="fa-solid fa-volume-high"></i>
                <button id="btn-vol-close" class="vol-close-btn"><i class="fa-solid fa-xmark"></i></button>
            </div>
        </header>

        <main class="player-body">
            <div class="album-section" id="album-trigger">
                <img src="" id="album-img" class="album-art" alt="Album Art">
                <div class="lyrics-view" id="lyrics-view">
                    <div class="lyrics-container">
                        <div id="lyrics-scroll-area"></div>
                    </div>
                </div>
                <div class="lyrics-hint">TAP FOR LYRICS</div>
            </div>

            <div class="info-section">
                <img src="" id="artist-avatar" class="artist-avatar" alt="Profile photo">
                <div class="text-group">
                    <h2 id="disp-title">Loading...</h2>
                    <p id="disp-artist">Andre Youth</p>
                </div>
                <button id="btn-scrap" class="heart-btn" aria-label="좋아요">
                    <i class="fa-regular fa-heart"></i>
                </button>
            </div>

            <div class="playback-section">
                <input type="range" id="progress-bar" value="0" step="0.1" min="0" max="100">
                <div class="time-row">
                    <span id="time-now">0:00</span>
                    <span id="time-total">0:00</span>
                </div>
            </div>

            <div class="control-section">
                <button id="btn-shuffle" class="opt-btn" aria-label="셔플">
                    <i class="fa-solid fa-shuffle"></i>
                </button>
                <button id="btn-prev" class="main-btn side" aria-label="이전 곡">
                    <i class="fa-solid fa-backward-step"></i>
                </button>
                <div class="play-btn-glow">
                    <button id="btn-play-pause" class="main-btn play" aria-label="재생/일시정지">
                        <i class="fa-solid fa-play"></i>
                    </button>
                </div>
                <button id="btn-next" class="main-btn side" aria-label="다음 곡">
                    <i class="fa-solid fa-forward-step"></i>
                </button>
                <button id="btn-repeat" class="opt-btn" aria-label="반복">
                    <i class="fa-solid fa-repeat"></i>
                    <span class="repeat-dot"></span>
                </button>
            </div>
        </main>

        <div id="chat-overlay" class="ios-popup">
            <div class="popup-card glass-card">
                <div class="popup-header">
                    <span>기도 제목 나누기</span>
                    <button class="close-x"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <div id="chat-messages" class="chat-viewport"></div>
                <div class="chat-input-row">
                    <input type="text" id="chat-input" placeholder="기도 제목을 적어주세요..." autocomplete="off">
                    <button id="btn-send-chat" class="send-btn"><i class="fa-solid fa-arrow-up"></i></button>
                </div>
            </div>
        </div>

        <!-- Info Overlay (Modified from Copyright Overlay) -->
        <div id="copyright-overlay" class="ios-popup">
            <div class="popup-card glass-card">
                <div class="popup-header">
                    <span>플레이리스트 정보</span>
                    <button class="close-x"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <div class="popup-body" id="info-popup-body">
                    <div class="info-menu-buttons">
                        <button id="btn-inquiry" class="menu-btn inquiry-btn">
                            <i class="fa-solid fa-envelope"></i> 플레이 리스트 문의
                        </button>
                        <button id="btn-show-login" class="menu-btn admin-btn">
                            <i class="fa-solid fa-user-shield"></i> 관리자 로그인
                        </button>
                    </div>

                    <!-- Login Section -->
                    <div id="login-section" class="auth-section hidden-section">
                        <h3>관리자 로그인</h3>
                        <div class="input-group">
                            <input type="text" id="login-id" placeholder="아이디">
                            <input type="password" id="login-pw" placeholder="비밀번호">
                        </div>
                        <div class="auth-actions">
                            <button id="btn-login-submit" class="auth-btn submit-btn">로그인</button>
                            <button id="btn-go-signup" class="auth-btn link-btn">회원가입</button>
                        </div>
                        <button id="btn-back-to-menu" class="back-btn"><i class="fa-solid fa-chevron-left"></i> 뒤로가기</button>
                    </div>

                    <!-- Signup Section -->
                    <div id="signup-section" class="auth-section hidden-section">
                        <h3>관리자 회원가입</h3>
                        <div class="input-group">
                            <input type="text" id="signup-id" placeholder="아이디 (필수)">
                            <input type="password" id="signup-pw" placeholder="비밀번호 (필수)">
                            <input type="text" id="signup-name" placeholder="이름 (필수)">
                            <input type="text" id="signup-phone" placeholder="전화번호 (필수)">
                            <input type="text" id="signup-unique" placeholder="고유번호 (필수)">
                            <input type="text" id="signup-company" placeholder="사명 (필수)">
                            <input type="text" id="signup-position" placeholder="직책 (필수)">
                        </div>
                        <div class="auth-actions">
                            <button id="btn-signup-submit" class="auth-btn submit-btn">가입신청</button>
                        </div>
                        <button id="btn-back-to-login" class="back-btn"><i class="fa-solid fa-chevron-left"></i> 뒤로가기</button>
                    </div>
                </div>
            </div>
        </div>

        <section class="bottom-sheet glass-sheet" id="sheet">
            <div class="sheet-top" id="sheet-trigger">
                <div class="drag-pill"></div>
                <div class="sheet-title">PLAYLIST</div>
            </div>
            <div class="sheet-main">
                <div class="list-head">
                    <h3>곡 목록</h3>
                    <span class="count-txt">총 <span id="total-count">0</span>곡</span>
                </div>
                <div class="list-scroll-area">
                    <ul id="song-list-ul"></ul>
                </div>
            </div>
        </section>
    </div>

    <audio id="audio-engine"></audio>

    <script defer src="config.js?v=20260428-1"></script>
    <script defer src="playlist-data.js?v=20260428-1"></script>
    <script defer src="music-engine.js?v=20260428-4"></script>
    <script defer src="script.js?v=20260428-4"></script>
</body>

</html>
