<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Andre Youth Admin - New Song Upload</title>
    <link rel="stylesheet" href="style.css?v=1.1">
    <link rel="stylesheet" href="admin-style.css?v=1.1">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <div id="bg-image" style="background-image: url('https://images.unsplash.com/photo-1514525253361-bee8718a300c?auto=format&fit=crop&q=80&w=1000');"></div>
    <div class="glass-background"></div>

    <div class="admin-container">
        <header class="admin-header">
            <div class="nav-side">
                <a href="index.html" class="icon-btn" aria-label="플레이어로 돌아가기">
                    <i class="fa-solid fa-chevron-left"></i>
                </a>
            </div>
            <div class="nav-title">
                <span class="sub-title">관리자 전용</span>
                <span class="main-title">새 찬양 업로드</span>
            </div>
            <div class="nav-side"></div>
        </header>

        <main class="admin-main">
            <div class="upload-card glass-card">
                <div class="form-group">
                    <label for="song-title">곡 제목 (필수)</label>
                    <input type="text" id="song-title" placeholder="곡 제목을 입력하세요" autocomplete="off">
                </div>

                <div class="form-group lyrics-editor-zone">
                    <label for="lyrics-raw" class="premium-label"><i class="fa-solid fa-wand-magic-sparkles"></i> 스마트 가사 생성기 (텍스트 붙여넣기)</label>
                    <textarea id="lyrics-raw" rows="8" placeholder="이곳에 노래 전체 가사를 붙여넣으세요. 한 줄씩 구분되어 있으면 가장 정확하게 싱크가 만들어집니다."></textarea>
                    <div class="sync-controls">
                        <button id="btn-sync-mode" class="premium-sync-btn"><i class="fa-solid fa-clock-rotate-left"></i> 싱크 맞추기 시작</button>
                        <div id="sync-active-info" style="display: none;">
                            <span class="active-lyric-hint">다음 줄 타이밍: <strong id="next-lyric-text">...</strong></span>
                            <button id="btn-tap-sync" class="pulse-btn">지금! (TAP)</button>
                        </div>
                    </div>
                    <div id="generated-lrc-preview" class="lrc-preview"></div>
                </div>

                <div class="drop-zone-container">
                    <div class="drop-zone" id="drop-audio" data-type="audio">
                        <input type="file" id="file-audio" accept="audio/*" hidden>
                        <i class="fa-solid fa-music"></i>
                        <p>음원 파일 (.mp3)</p>
                        <span class="file-info">드래그 또는 클릭</span>
                    </div>

                    <div class="drop-zone" id="drop-image" data-type="image">
                        <input type="file" id="file-image" accept="image/*" hidden>
                        <i class="fa-solid fa-image"></i>
                        <p>커버 이미지 (.jpg)</p>
                        <span class="file-info">드래그 또는 클릭</span>
                    </div>
                </div>

                <button id="btn-upload-all" class="primary-btn upload-all-btn">
                    <i class="fa-solid fa-cloud-arrow-up"></i> 한 번에 업로드 시작
                </button>

                <div id="upload-progress-container" class="progress-container" style="display: none;">
                    <div class="progress-info">
                        <span id="upload-status-text">파일 처리 중...</span>
                        <span id="progress-percent">0%</span>
                    </div>
                    <div class="progress-bar">
                        <div id="progress-fill" class="progress-fill"></div>
                    </div>
                </div>
            </div>

            <!-- 현재 곡 관리 섹션 (New) -->
            <div class="manage-card glass-card">
                <div class="manage-header">
                    <h3>현재 등록된 곡 목록</h3>
                    <button id="btn-refresh-list" class="icon-btn" aria-label="목록 갱신"><i class="fa-solid fa-rotate"></i></button>
                </div>
                <div id="admin-song-list" class="admin-song-list">
                    <div class="loading-spinner">목록 불러오는 중...</div>
                </div>
            </div>
            </div>
        </main>
    </div>

    <script src="admin-script.js?v=1.1"></script>
</body>
</html>
